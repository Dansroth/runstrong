<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RunStrong — force update</title>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e8edf4;padding:40px 24px;text-align:center;margin:0">
  <h2 style="color:#4ade80">RunStrong force-update</h2>
  <p id="s" style="line-height:1.6">Clearing cached app code…<br><span style="color:#8b96a5;font-size:.85rem">Your training data is not touched — it lives separately and stays put.</span></p>
  <script>
    (async () => {
      const s = document.getElementById('s');
      try {
        if ('serviceWorker' in navigator) {
          for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
        }
        if (window.caches) {
          for (const k of await caches.keys()) await caches.delete(k);
        }
        s.innerHTML = '✅ Old app code cleared. Loading the latest version…<br><span style="color:#8b96a5;font-size:.85rem">Your training data is untouched.</span>';
        setTimeout(() => location.replace('./index.html?fresh=' + Date.now()), 900);
      } catch (e) {
        s.textContent = 'That did not work: ' + e.message;
      }
    })();
  </script>
</body>
</html>
